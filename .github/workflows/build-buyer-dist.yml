name: Build Buyer App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-buyer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/buyer-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/buyer-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build buyer app
        run: npm run build

      - name: Upload buyer dist
        uses: actions/upload-artifact@v4
        with:
          name: justbrand-buyer-dist
          path: apps/buyer-app/dist
          if-no-files-found: error
